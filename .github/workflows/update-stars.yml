name: Update Total Stars

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stars:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Count stars and update README
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');

            // The default GITHUB_TOKEN is an app installation token with no
            // "authenticated user" behind it, so /user/* endpoints fail with
            // "Resource not accessible by integration". listForUser works with
            // it and returns the owner's public repos, which is everything this
            // badge counts (org-member and collaborator repos hold zero stars).
            const repos = await github.paginate(github.rest.repos.listForUser, {
              username: context.repo.owner,
              type: 'owner',
              per_page: 100,
            });

            let totalStars = 0;
            for (const repo of repos) {
              if (repo.private) continue;
              totalStars += repo.stargazers_count;
              if (repo.stargazers_count > 0) {
                console.log(`${repo.full_name}: ${repo.stargazers_count}`);
              }
            }
            console.log(`total across ${repos.length} public repos: ${totalStars}`);

            let readme = fs.readFileSync('README.md', 'utf8');
            if (!readme.includes('<!--STARS_START-->') || !readme.includes('<!--STARS_END-->')) {
              throw new Error('STARS_START/STARS_END markers not found in README.md');
            }
            readme = readme.replace(
              /<!--STARS_START-->[\s\S]*?<!--STARS_END-->/,
              `<!--STARS_START-->\n![Total Stars](https://img.shields.io/badge/total_stars-${totalStars}-yellow?style=for-the-badge&logo=github)\n<!--STARS_END-->`
            );
            fs.writeFileSync('README.md', readme);

      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git diff --quiet || (git add README.md && git commit -m "update total stars count" && git push)
